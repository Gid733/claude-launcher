<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a7a"/>
      <stop offset="0.55" stop-color="#4a2f86"/>
      <stop offset="1" stop-color="#6e2d8f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7cc0" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#e2479b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e2479b" stop-opacity="0"/>
    </radialGradient>
    <!-- In each ray's own rotated space: magenta at the tip, near-white at the core. -->
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="0" y1="-74" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4f9e"/>
      <stop offset="1" stop-color="#ffd9ee"/>
    </linearGradient>
    <path id="sparkle" d="M0 -10 C1.6 -2.4 2.4 -1.6 10 0 C2.4 1.6 1.6 2.4 0 10 C-1.6 2.4 -2.4 1.6 -10 0 C-2.4 -1.6 -1.6 -2.4 0 -10 Z"/>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#ground)"/>
  <rect x="3" y="3" width="250" height="250" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <circle cx="128" cy="134" r="98" fill="url(#aura)"/>

  <!-- A 12-ray spark with uneven ray lengths and angles, drawn from the centre. -->
  <g transform="translate(128 134)" stroke="url(#ray)" stroke-width="15" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="-74"/>
    <line x1="0" y1="0" x2="0" y2="-62" transform="rotate(31)"/>
    <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(58)"/>
    <line x1="0" y1="0" x2="0" y2="-58" transform="rotate(90)"/>
    <line x1="0" y1="0" x2="0" y2="-72" transform="rotate(121)"/>
    <line x1="0" y1="0" x2="0" y2="-60" transform="rotate(150)"/>
    <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(181)"/>
    <line x1="0" y1="0" x2="0" y2="-56" transform="rotate(211)"/>
    <line x1="0" y1="0" x2="0" y2="-71" transform="rotate(238)"/>
    <line x1="0" y1="0" x2="0" y2="-61" transform="rotate(270)"/>
    <line x1="0" y1="0" x2="0" y2="-69" transform="rotate(301)"/>
    <line x1="0" y1="0" x2="0" y2="-57" transform="rotate(331)"/>
  </g>
  <circle cx="128" cy="134" r="15" fill="#ffe9f5"/>

  <g fill="#ffffff">
    <use href="#sparkle" transform="translate(198 52) scale(1.5)"/>
    <use href="#sparkle" transform="translate(56 60) scale(0.9)" opacity="0.9"/>
    <use href="#sparkle" transform="translate(212 196) scale(1)" opacity="0.85"/>
    <use href="#sparkle" transform="translate(44 200) scale(1.2)"/>
    <use href="#sparkle" transform="translate(166 22) scale(0.6)" opacity="0.7"/>
  </g>
</svg>
